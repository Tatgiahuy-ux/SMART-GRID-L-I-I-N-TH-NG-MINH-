# Cấu hình Streamlit cho demo Smart Grid (Nhóm 17).
#
# File này KHÔNG chứa secret nên được commit vào git. Secret (nếu sau này có) phải để ở
# .streamlit/secrets.toml — file đó đã bị .gitignore chặn.

[server]
# Mục 8 – giới hạn dung lượng upload: 5 MB (mặc định của Streamlit là 200 MB).
# Phải khớp với MAX_UPLOAD_MB trong security.py.
maxUploadSize = 5

# Mục 16 – tuyệt đối không dùng CORS dấu sao: giữ bảo vệ CORS + XSRF của Streamlit.
# (Đặt enableCORS = false sẽ khiến Streamlit trả "Access-Control-Allow-Origin: *".)
enableCORS = true
enableXsrfProtection = true

# Mục 15 – SameSite cho cookie XSRF. "lax" là mặc định an toàn cho web chạy sau HTTPS.
# Chỉ đổi sang "none" khi thật sự cần nhúng cross-site, và phải hiểu rủi ro CSRF.
xsrfCookieSameSite = "lax"

[client]
# Mục 6 – không hiển thị traceback / chi tiết lỗi ra trình duyệt.
# Khi cần gỡ lỗi lúc phát triển, chạy tạm:
#   streamlit run app.py --client.showErrorDetails=full
showErrorDetails = "none"

[browser]
# Không gửi thống kê sử dụng ra ngoài.
gatherUsageStats = false

[theme]
# Dark operations dashboard: neutral navy surfaces with an energy-green action color.
base = "dark"
primaryColor = "#22C55E"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#182235"
textColor = "#F8FAFC"
linkColor = "#86EFAC"
borderColor = "#475569"
font = "sans-serif"
headingFont = "sans-serif"
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true
greenColor = "#22C55E"
greenBackgroundColor = "#143522"
greenTextColor = "#86EFAC"
redColor = "#F87171"
redBackgroundColor = "#3A1D29"
redTextColor = "#FCA5A5"
orangeColor = "#F59E0B"
orangeBackgroundColor = "#3A2A12"
orangeTextColor = "#FCD34D"
blueColor = "#60A5FA"
grayColor = "#94A3B8"
chartCategoricalColors = ["#22C55E", "#60A5FA", "#F59E0B", "#A78BFA", "#F87171"]
dataframeHeaderBackgroundColor = "#202B40"
dataframeHeaderTextColor = "#F8FAFC"

[theme.sidebar]
backgroundColor = "#111C31"
secondaryBackgroundColor = "#182235"
textColor = "#F8FAFC"
borderColor = "#334155"
primaryColor = "#22C55E"
